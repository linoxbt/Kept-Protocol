name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kept
          POSTGRES_PASSWORD: kept
          POSTGRES_DB: kept_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kept" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://kept:kept@localhost:5432/kept_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # A prompt or method change cannot ship with a critical or high Grifter regression.
      - run: npm run grifter
      - run: npm run build
        env:
          DATABASE_URL: postgres://kept:kept@localhost:5432/kept_test

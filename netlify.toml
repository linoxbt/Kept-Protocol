# Netlify serves kept-protocol.netlify.app as an edge proxy in front of the Railway web service,
# which runs the full Next.js app with no function time limit and reads its own bootstrapped
# secrets. Netlify therefore needs no environment variables and holds no secrets.
[build]
  command = "mkdir -p netlify-edge && echo 'Kept Protocol' > netlify-edge/index.txt"
  publish = "netlify-edge"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/*"
  to = "https://kept-web-production-ef47f9ac.up.railway.app/:splat"
  status = 200
  force = true
  headers = { X-From = "netlify" }
